name: CI

on:
  push:
    branches: [main, improve/safe-quality]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Skrip "lint" saat ini hanya alias typecheck (tsc --noEmit), jadi cukup dijalankan sekali.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
