<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Indigo Gradient -->
    <linearGradient id="adaptiv-a-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4D62F8" />
      <stop offset="100%" stop-color="#3F55F0" />
    </linearGradient>
    <!-- Right leg shadow under arrow -->
    <linearGradient id="adaptiv-shadow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2835AB" />
      <stop offset="100%" stop-color="#1E2888" />
    </linearGradient>
    <!-- Dynamic Arrow Gradient -->
    <linearGradient id="adaptiv-arrow-grad" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A7CF8" />
      <stop offset="100%" stop-color="#5599FF" />
    </linearGradient>
    <filter id="shadow-soft" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F1B4A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Letter A Base (Indigo) -->
  <g filter="url(#shadow-soft)">
    <!-- Left Leg & Apex -->
    <path d="M250 82 C268 82 284 94 292 110 L370 270 C377 285 382 301 392 316 L404 332 C412 344 404 360 388 360 L330 360 C316 360 304 350 299 337 L285 304 C282 297 274 293 267 296 C262 298 259 303 262 308 L282 355 C285 362 280 370 272 370 L220 370 C207 370 196 361 192 349 L142 225 C139 217 143 209 151 206 C158 203 166 207 169 214 L204 300 C206 305 212 308 217 305 C222 302 223 296 220 291 L210 268 C204 254 207 238 218 227 L226 218 C232 212 235 204 233 196 L224 162 C222 153 227 145 236 142 C240 141 245 141 250 141 Z" fill="url(#adaptiv-a-grad)" />

    <!-- A Shape Clean Curve Path -->
    <path d="M250 90 C264 90 276 98 283 111 L378 282 C386 297 395 320 405 342 C410 354 401 366 388 366 L334 366 C322 366 312 358 307 347 L284 296 C282 291 275 288 270 291 C265 294 263 300 265 305 L288 357 C292 366 285 376 275 376 L220 376 C209 376 199 369 195 358 L114 186 C108 173 118 158 132 158 L170 158 C182 158 192 165 197 176 L216 218 C220 226 228 231 236 230 C244 229 250 223 251 215 L254 135 C254 110 252 90 250 90 Z" fill="url(#adaptiv-a-grad)" opacity="0.95"/>
    
    <!-- Right leg lower segment (darker indigo shadow fold) -->
    <path d="M305 240 L378 350 C382 357 377 366 369 366 L325 366 C314 366 304 359 300 349 L270 270 Z" fill="url(#adaptiv-shadow-grad)" />

    <!-- Curved Dynamic Arrow (Sky Blue #4A8BFF) -->
    <!-- Sweeps from lower left of A, across the crossbar, ascending to top-right with arrowhead -->
    <path d="M125 300 C110 320 120 350 148 350 C180 350 215 325 255 305 C295 285 330 270 365 240 C385 223 400 198 410 172 L422 182 C428 187 438 183 438 174 L438 108 C438 102 433 97 427 97 L361 97 C352 97 348 107 353 113 L366 126 C350 148 332 170 310 188 C272 220 235 235 190 255 C160 268 138 282 125 300 Z" fill="url(#adaptiv-arrow-grad)" />
    
    <!-- Arrowhead accent highlight -->
    <polygon points="438,102 438,170 398,130" fill="#62A5FF" opacity="0.4" />
  </defs>
</svg>
